<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Apex – compare landing sites</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="controls">
  <h1>Lunar Apex</h1>
  <p class="lede">Compare Sun and Earth visibility at lunar landing sites.</p>

  <fieldset>
    <legend>Sites (pick up to 4)</legend>
    <div id="siteList"></div>
    <div class="row">
      <input id="customLat" type="number" step="any" placeholder="Latitude" aria-label="Custom latitude">
      <input id="customLon" type="number" step="any" placeholder="Longitude" aria-label="Custom longitude">
      <button id="addCustom" type="button">Add</button>
    </div>
  </fieldset>

  <label>Start date and time (UTC)
    <input id="start" type="datetime-local">
  </label>
  <label>Window
    <select id="hours">
      <option value="168">7 days</option>
      <option value="360">15 days</option>
      <option value="720" selected>1 lunar day (30 days)</option>
      <option value="2160">90 days</option>
    </select>
  </label>
  <label>Terrain horizon (degrees)
    <input id="horizon" type="number" min="-5" max="30" step="0.5" value="0">
    <small>Raises the horizon to model nearby hills or crater walls.</small>
  </label>
  <label>Data source
    <select id="source">
      <option value="analytic">Fast estimate (±2°)</option>
      <option value="horizons">JPL Horizons (accurate)</option>
    </select>
  </label>
  <button id="run" type="button" class="primary">Compare sites</button>
  <p id="status" role="status"></p>
</aside>

<main>
  <div id="empty">Select at least one site, then choose Compare sites.</div>
  <div id="cards"></div>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
